<!DOCTYPE html>
<html>
<head>
    <title>EV Charging Status</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
        rel="stylesheet">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <style>

        body {
            font-family: 'Roboto', sans-serif;
            margin: 12px;
            background-color: #222;
            color: #fff;
        }

        h1 {
            margin-top: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: #fff;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        input {
            margin-bottom: 12px;
            padding: 8px;
            font-family: 'Roboto', sans-serif;
            background-color: #444;
            color: #fff;
            border: 1px solid #444;
            text-align: center;
            width: 90%;
            max-width: 250px;
            font-weight: bold;
            font-size: 1.1em;
            box-sizing: border-box;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            background-color: #1a5178;
            color: #fff;
            border: none;
            padding: 17px 17px;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            width: 90%;
            max-width: 125px;
            font-size: 1.1em;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #444;
        }

        .delete-all-btn {
            background-color: #a33131;
            color: #fff;
            border: none;
            padding: 7px 10px;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            width: 80%;
            max-width: 125px;
            margin: 10px auto 0;
            display: block;
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        #loading {
            display: none;
            text-align: center;
            font-weight: bold;
            color: #ffde21;
            font-size: 1.4em;
            margin-top: -4px;
            margin-bottom: 8px;
        }

        .table-container {
            overflow-x: auto;
            max-width: 100%;
            margin-bottom: 100px;
        }

        table {
            width: 100%;
            max-width: 800px;
            border-collapse: collapse;
            margin: 0 auto;
        }

        th,
        td {
            border: 1px solid #444;
            padding: 4px;
            text-align: center;
        }

        th {
            background-color: #333;
        }

        td {
            background-color: #222;
        }

        td[data-label="Name"] {
            font-weight: bold;
        }

        .delete-btn {
            background-color: #a33131;
            color: #fff;
            border: none;
            padding: 0;
            width: 19px;
            height: 19px;
            line-height: 19px;
            font-size: 13px;
        }

        .end-btn {
            background-color: #1a5178;
            color: #fff;
            border: none;
            padding: 0;
            width: 45px;
            height: 19px;
            line-height: 19px;
            font-size: 13px;
        }

        .active-row {
            border: 3px solid #67bd4b;
        }

        .active-row td {
            background-color: #243b1d;
        }

        thead {
            display: none;
        }


        /* =====================================
           HOURS / ROTB-STYLE ENTRY OVERLAY
           ===================================== */

        #hoursOverlay {
            display: none;

            position: fixed;

            z-index: 9000;

            background: rgba(0,0,0,.52);

            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);

            align-items: center;
            justify-content: center;

            box-sizing: border-box;

            padding: 18px;
        }


        #hoursPopup {
            width: 84%;
            max-width: 310px;

            background: #080808;

            border: 2px solid #fff;
            border-radius: 8px;

            text-align: center;

            padding: 22px 20px 20px;

            box-sizing: border-box;
        }


        .hours-title {
            color: #fff;

            font-size: 1.45em;
            font-weight: bold;

            margin-bottom: 3px;
        }


        .hours-range {
            color: #fff;

            font-size: .95em;

            margin-bottom: 16px;
        }


        #hoursPopupInput {
            width: 100%;
            max-width: none;

            height: 58px;

            margin: 0;

            padding: 6px;

            box-sizing: border-box;

            background: #d8d8d8;

            color: #111;

            border: 2px solid #eee;
            border-radius: 5px;

            outline: none;

            text-align: center;

            font-size: 1.8em;
            font-weight: bold;

            caret-color: #111;
        }


        /* =====================================
           NORMAL CUSTOM ALERTS
           ===================================== */

        .custom-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;

            background-color: rgba(0,0,0,.55);

            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            z-index: 9999;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .custom-modal-box {
            width: 90%;
            max-width: 320px;

            background-color: #111;

            border: 2px solid #fff;
            border-radius: 8px;

            padding: 25px 20px 20px;

            text-align: center;

            box-sizing: border-box;
        }

        .custom-modal-message {
            color: #fff;

            font-size: 1.15em;
            font-weight: bold;
            line-height: 1.4;

            margin-bottom: 22px;
        }

        .custom-modal-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .custom-modal-button {
            background-color: #1a5178;
            color: #fff;

            border: none;

            padding: 12px 18px;

            cursor: pointer;

            font-family: 'Roboto', sans-serif;
            font-weight: bold;

            width: auto;
            min-width: 95px;

            font-size: 1em;

            text-transform: uppercase;
        }

        .custom-modal-cancel {
            background-color: #444;
        }

        .custom-modal-delete {
            background-color: #a33131;
        }


        @media (min-width: 601px) {

            thead[data-loaded="true"] {
                display: table-header-group;
            }

        }


        @media (max-width: 600px) {

            h1 {
                font-size: 1.5em;
            }

            table {
                border: 0;
            }

            thead {
                display: none;
            }

            tr {
                margin-bottom: 10px;
                display: block;
                border: 1px solid #555;
            }

            td {
                display: block;
                text-align: right;
                font-size: 13px;

                border-bottom: 1px dotted #555;

                position: relative;

                padding-left: 50%;
                padding-right: 15px;
            }

            td:before {
                content: attr(data-label);

                position: absolute;
                left: 0;

                width: 50%;

                padding-left: 15px;

                font-weight: bold;
                text-align: left;
            }

            td:last-child {
                border-bottom: 0;

                padding-left: 0;

                text-align: center;

                padding: 3px 5px;

                display: flex;

                justify-content: center;
                align-items: center;

                gap: 25px;
            }

            .delete-all-btn {
                margin: 10px auto 0;
            }
        }

    </style>
</head>


<body>


<h1>EV Charging Status</h1>


<form
    id="chargingForm"
    onsubmit="submitEntry(); return false;"
    novalidate>


    <input
        id="name"
        placeholder="Name - Vehicle Make">


    <!--
        DISPLAY FIELD ONLY.
        Tapping this launches the popup.
    -->

    <input
        id="hours"
        type="text"
        placeholder="Hours"
        readonly>


    <div id="loading">
        - - - LOADING - - -
    </div>


    <button type="submit">
        Submit
    </button>

</form>



<div class="table-container">

    <table id="statusTable">

        <thead>

            <tr>
                <th>Name</th>
                <th>Start</th>
                <th>End</th>
                <th>Time Left</th>
                <th></th>
            </tr>

        </thead>

        <tbody></tbody>

    </table>

</div>



<button
    class="delete-all-btn"
    onclick="deleteAllEntries()">

    Delete All

</button>



<!-- =====================================
     HOURS POPUP
     ===================================== -->

<div id="hoursOverlay">

    <div id="hoursPopup">

        <div class="hours-title">
            HOURS
        </div>

        <div class="hours-range">
            (.5 - 4.5)
        </div>

        <input
            id="hoursPopupInput"
            type="number"
            inputmode="decimal"
            enterkeyhint="done"
            step="0.25">

    </div>

</div>



<!-- =====================================
     NORMAL CUSTOM MODAL
     ===================================== -->

<div
    id="customModal"
    class="custom-modal-overlay">

    <div class="custom-modal-box">

        <div
            id="customModalMessage"
            class="custom-modal-message">
        </div>


        <div class="custom-modal-buttons">

            <button
                id="customModalCancel"
                type="button"
                class="custom-modal-button custom-modal-cancel">

                Cancel

            </button>


            <button
                id="customModalConfirm"
                type="button"
                class="custom-modal-button">

                OK

            </button>

        </div>

    </div>

</div>



<script>

const scriptURL =
'https://script.google.com/macros/s/AKfycbyZcX0HZZga0SZsMwwb5Qc0Dba88GpEEajyH-btkj02c6HvZgEeFxitvxlTjoU3eA6t6A/exec';


let currentData = [];

let modalConfirmAction = null;
let modalCancelAction = null;

let hoursPopupOpen = false;

let popupOpeningHeight = 0;



const hoursField =
    document.getElementById('hours');

const hoursOverlay =
    document.getElementById('hoursOverlay');

const hoursPopup =
    document.getElementById('hoursPopup');

const hoursPopupInput =
    document.getElementById('hoursPopupInput');



/* =====================================
   POSITION POPUP USING REAL
   VISIBLE SCREEN ABOVE KEYBOARD
   ===================================== */

function positionHoursOverlay() {

    if (!hoursPopupOpen) {
        return;
    }


    if (window.visualViewport) {

        const vv =
            window.visualViewport;


        hoursOverlay.style.left =
            vv.offsetLeft + 'px';

        hoursOverlay.style.top =
            vv.offsetTop + 'px';

        hoursOverlay.style.width =
            vv.width + 'px';

        hoursOverlay.style.height =
            vv.height + 'px';

    }

    else {

        hoursOverlay.style.left =
            '0px';

        hoursOverlay.style.top =
            '0px';

        hoursOverlay.style.width =
            '100%';

        hoursOverlay.style.height =
            window.innerHeight + 'px';

    }

}



/* =====================================
   OPEN HOURS POPUP
   ===================================== */

function openHoursPopup() {

    if (hoursPopupOpen) {
        return;
    }


    hoursPopupOpen = true;


    hoursPopupInput.value = '';


    popupOpeningHeight =
        window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;


    hoursOverlay.style.display =
        'flex';


    positionHoursOverlay();


    /*
        Focus immediately.

        This is what causes Gboard to appear.
    */

    requestAnimationFrame(
        function() {

            hoursPopupInput.focus();

        }
    );

}



/* =====================================
   CLOSE HOURS POPUP
   ===================================== */

function closeHoursPopup(
    keepTypedValue = true
) {

    if (!hoursPopupOpen) {
        return;
    }


    const typed =
        hoursPopupInput.value.trim();


    if (
        keepTypedValue &&
        typed !== ''
    ) {

        hoursField.value =
            typed;

    }


    hoursPopupOpen =
        false;


    hoursPopupInput.blur();


    hoursOverlay.style.display =
        'none';


    hoursOverlay.style.left =
        '0px';

    hoursOverlay.style.top =
        '0px';

    hoursOverlay.style.width =
        '100%';

    hoursOverlay.style.height =
        '100%';

}



/* =====================================
   TAP HOURS FIELD
   ===================================== */

hoursField.addEventListener(
    'click',
    function() {

        openHoursPopup();

    }
);



/* =====================================
   KEYBOARD ENTER / ARROW
   ===================================== */

hoursPopupInput.addEventListener(
    'keydown',
    function(event) {

        if (
            event.key === 'Enter'
        ) {

            event.preventDefault();


            const typed =
                hoursPopupInput.value.trim();


            if (
                typed !== ''
            ) {

                hoursField.value =
                    typed;

            }


            /*
                Close popup + keyboard.
            */

            closeHoursPopup(true);


            /*
                EXACT SAME BEHAVIOR
                AS PRESSING SUBMIT.
            */

            submitEntry();

        }

    }
);



/* =====================================
   TAP BLURRED AREA
   ===================================== */

hoursOverlay.addEventListener(
    'pointerdown',
    function(event) {

        if (
            event.target ===
            hoursOverlay
        ) {

            /*
                Keep anything typed.

                Do NOT submit.
            */

            closeHoursPopup(true);

        }

    }
);



hoursPopup.addEventListener(
    'pointerdown',
    function(event) {

        event.stopPropagation();

    }
);



/* =====================================
   WATCH GBOARD / VISUAL VIEWPORT
   ===================================== */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        'resize',
        function() {

            if (!hoursPopupOpen) {
                return;
            }


            positionHoursOverlay();


            /*
                If Android Back closes Gboard,
                the visual viewport suddenly
                gets much taller again.

                When that happens, close the
                HOURS popup too.
            */

            const currentHeight =
                window.visualViewport.height;


            if (
                popupOpeningHeight > 0 &&
                currentHeight >
                popupOpeningHeight - 40 &&
                document.activeElement !==
                hoursPopupInput
            ) {

                closeHoursPopup(true);

            }

        }
    );


    window.visualViewport.addEventListener(
        'scroll',
        function() {

            positionHoursOverlay();

        }
    );

}



/* =====================================
   CUSTOM ALERT
   ===================================== */

function showAlert(
    message,
    buttonText = 'OK',
    afterClose = null
) {

    const modal =
        document.getElementById(
            'customModal'
        );

    const messageBox =
        document.getElementById(
            'customModalMessage'
        );

    const confirmButton =
        document.getElementById(
            'customModalConfirm'
        );

    const cancelButton =
        document.getElementById(
            'customModalCancel'
        );


    messageBox.textContent =
        message;


    cancelButton.style.display =
        'none';


    confirmButton.textContent =
        buttonText;


    confirmButton.className =
        'custom-modal-button';


    modalConfirmAction =
        function() {

            closeModal();


            if (afterClose) {

                afterClose();

            }

        };


    modalCancelAction =
        null;


    modal.style.display =
        'flex';

}



/* =====================================
   CUSTOM CONFIRM
   ===================================== */

function showConfirm(
    message,
    confirmText,
    onConfirm,
    danger = false
) {

    const modal =
        document.getElementById(
            'customModal'
        );

    const messageBox =
        document.getElementById(
            'customModalMessage'
        );

    const confirmButton =
        document.getElementById(
            'customModalConfirm'
        );

    const cancelButton =
        document.getElementById(
            'customModalCancel'
        );


    messageBox.textContent =
        message;


    cancelButton.style.display =
        'inline-block';


    cancelButton.textContent =
        'Cancel';


    confirmButton.textContent =
        confirmText;


    confirmButton.className =
        danger
            ? 'custom-modal-button custom-modal-delete'
            : 'custom-modal-button';


    modalConfirmAction =
        function() {

            closeModal();

            onConfirm();

        };


    modalCancelAction =
        function() {

            closeModal();

        };


    modal.style.display =
        'flex';

}



function closeModal() {

    document
        .getElementById(
            'customModal'
        )
        .style.display =
            'none';


    modalConfirmAction =
        null;

    modalCancelAction =
        null;

}



document
    .getElementById(
        'customModalConfirm'
    )
    .addEventListener(
        'click',
        function() {

            if (
                modalConfirmAction
            ) {

                const action =
                    modalConfirmAction;

                action();

            }

        }
    );



document
    .getElementById(
        'customModalCancel'
    )
    .addEventListener(
        'click',
        function() {

            if (
                modalCancelAction
            ) {

                const action =
                    modalCancelAction;

                action();

            }

            else {

                closeModal();

            }

        }
    );



/* =====================================
   LOAD DATA
   ===================================== */

function loadData() {

    document
        .getElementById(
            'loading'
        )
        .style.display =
            'block';


    fetch(scriptURL)

        .then(
            response =>
                response.json()
        )

        .then(
            data => {

                currentData =
                    data;


                renderTable();


                document
                    .querySelector(
                        'thead'
                    )
                    .setAttribute(
                        'data-loaded',
                        'true'
                    );


                document
                    .getElementById(
                        'loading'
                    )
                    .style.display =
                        'none';

            }
        )

        .catch(
            error => {

                console.error(
                    'Error loading data:',
                    error
                );


                document
                    .getElementById(
                        'loading'
                    )
                    .style.display =
                        'none';

            }
        );

}



/* =====================================
   SUBMIT ENTRY
   ===================================== */

function submitEntry() {

    const name =
        document
            .getElementById(
                'name'
            )
            .value
            .trim();


    const hoursValue =
        hoursField
            .value
            .trim();



    if (
        !name &&
        !hoursValue
    ) {

        showAlert(
            'Please enter your Name and Hours.'
        );

        return;

    }



    if (!name) {

        showAlert(
            'Please enter your Name.'
        );

        return;

    }



    if (!hoursValue) {

        openHoursPopup();

        return;

    }



    const hours =
        parseFloat(
            hoursValue
        );



    if (
        isNaN(hours) ||
        hours <= 0
    ) {

        showAlert(
            'Please enter valid Hours greater than 0.'
        );

        return;

    }



    if (
        hours > 4.5
    ) {

        showAlert(

            'Max Time of 4.5 hrs.',

            'OK',

            function() {

                hoursField.value =
                    '';


                openHoursPopup();

            }

        );


        return;

    }



    localStorage.setItem(
        'lastName',
        name
    );


    const params =
        `?name=${encodeURIComponent(name)}&hours=${encodeURIComponent(hours)}`;


    document
        .getElementById(
            'loading'
        )
        .style.display =
            'block';



    fetch(
        scriptURL +
        params
    )

        .then(
            response =>
                response.json()
        )

        .then(
            data => {

                currentData =
                    data;


                renderTable();


                document
                    .getElementById(
                        'loading'
                    )
                    .style.display =
                        'none';


                hoursField.value =
                    '';

            }
        )

        .catch(
            error => {

                console.error(
                    'Fetch error:',
                    error
                );


                showAlert(
                    'Error submitting entry. Check console for details.'
                );


                document
                    .getElementById(
                        'loading'
                    )
                    .style.display =
                        'none';

            }
        );

}



/* =====================================
   DELETE ENTRY
   ===================================== */

function deleteEntry(start) {

    showConfirm(

        'Delete this entry?',

        'Delete',

        function() {

            const rows =
                document.querySelectorAll(
                    '#statusTable tbody tr[data-start]'
                );


            for (
                const row
                of rows
            ) {

                if (
                    row.getAttribute(
                        'data-start'
                    ) === start
                ) {

                    row.classList.remove(
                        'active-row'
                    );


                    const timeLeftCell =
                        row.querySelector(
                            'td[data-label="Time Left"]'
                        );


                    if (
                        timeLeftCell
                    ) {

                        timeLeftCell.innerHTML =
                            '<b style="font-size: 1.5em;">DELETING</b>';

                    }


                    break;

                }

            }


            const params =
                `?action=delete&start=${encodeURIComponent(start)}`;


            document
                .getElementById(
                    'loading'
                )
                .style.display =
                    'block';


            fetch(
                scriptURL +
                params
            )

                .then(
                    response =>
                        response.json()
                )

                .then(
                    data => {

                        currentData =
                            data;


                        renderTable();


                        document
                            .getElementById(
                                'loading'
                            )
                            .style.display =
                                'none';

                    }
                )

                .catch(
                    error => {

                        console.error(
                            'Delete error:',
                            error
                        );


                        showAlert(
                            'Error deleting entry. Check console for details.'
                        );


                        document
                            .getElementById(
                                'loading'
                            )
                            .style.display =
                                'none';

                    }
                );

        },

        true

    );

}



/* =====================================
   DELETE ALL
   ===================================== */

function deleteAllEntries() {

    showConfirm(

        'DELETE ALL ENTRIES?',

        'Delete All',

        function() {

            const params =
                '?action=delete_all';


            document
                .getElementById(
                    'loading'
                )
                .style.display =
                    'block';


            fetch(
                scriptURL +
                params
            )

                .then(
                    response =>
                        response.json()
                )

                .then(
                    data => {

                        currentData =
                            data;


                        renderTable();


                        document
                            .getElementById(
                                'loading'
                            )
                            .style.display =
                                'none';

                    }
                )

                .catch(
                    error => {

                        console.error(
                            'Delete all error:',
                            error
                        );


                        showAlert(
                            'Error deleting all entries. Check console for details.'
                        );


                        document
                            .getElementById(
                                'loading'
                            )
                            .style.display =
                                'none';

                    }
                );

        },

        true

    );

}



/* =====================================
   END SESSION
   ===================================== */

function endSession(start) {

    const params =
        `?action=end_session&start=${encodeURIComponent(start)}`;


    document
        .getElementById(
            'loading'
        )
        .style.display =
            'block';


    fetch(
        scriptURL +
        params
    )

        .then(
            response =>
                response.json()
        )

        .then(
            data => {

                currentData =
                    data;


                renderTable();


                document
                    .getElementById(
                        'loading'
                    )
                    .style.display =
                        'none';

            }
        )

        .catch(
            error => {

                console.error(
                    'End session error:',
                    error
                );


                showAlert(
                    'Error ending session.'
                );


                document
                    .getElementById(
                        'loading'
                    )
                    .style.display =
                        'none';

            }
        );

}



/* =====================================
   RENDER TABLE
   ===================================== */

function renderTable() {

    const tbody =
        document.querySelector(
            '#statusTable tbody'
        );


    tbody.innerHTML =
        '';


    const now =
        new Date();



    currentData.forEach(
        entry => {

            const startDate =
                new Date(
                    entry.Start
                );


            const endDate =
                new Date(
                    entry.End
                );


            const remainingMs =
                endDate -
                now;


            let left;

            let rowClass =
                '';



            if (
                remainingMs > 0
            ) {

                const hoursLeft =
                    Math.floor(
                        remainingMs /
                        3600000
                    );


                const minsLeft =
                    Math.floor(
                        (
                            remainingMs %
                            3600000
                        ) /
                        60000
                    );


                left =
                    `${hoursLeft < 1 ? '' : `<b style="font-size:1.5em;">${hoursLeft}</b> hr  `}<b style="font-size:1.5em;">${minsLeft}</b> mins`;


                rowClass =
                    'active-row';

            }

            else {

                left =
                    '<b>Session Ended</b>';

            }



            const formattedStart =
                `<span style="font-size:.8em;">${startDate.toLocaleDateString([], {month:'numeric',day:'numeric'})}</span> - <b>${startDate.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</b>`;


            const formattedEnd =
                `<span style="font-size:.8em;">${endDate.toLocaleDateString([], {month:'numeric',day:'numeric'})}</span> - <b>${endDate.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</b>`;



            const row =
                document.createElement(
                    'tr'
                );


            row.className =
                rowClass;


            row.setAttribute(
                'data-start',
                entry.Start
            );


            row.innerHTML = `

                <td data-label="Name">
                    ${entry.Name}
                </td>

                <td data-label="Start">
                    ${formattedStart}
                </td>

                <td data-label="End">
                    ${formattedEnd}
                </td>

                <td data-label="Time Left">
                    ${left}
                </td>

                <td data-label="">

                    <button
                        class="delete-btn"
                        onclick="deleteEntry('${entry.Start}')">

                        X

                    </button>

                    ${
                        remainingMs > 0

                            ? `<button
                                   class="end-btn"
                                   onclick="endSession('${entry.Start}')">

                                   End

                               </button>`

                            : ''
                    }

                </td>

            `;


            tbody.appendChild(
                row
            );

        }
    );

}



/* =====================================
   RESTORE LAST NAME
   ===================================== */

const lastName =
    localStorage.getItem(
        'lastName'
    );


if (lastName) {

    document
        .getElementById(
            'name'
        )
        .value =
            lastName;

}



/* INITIAL LOAD */

loadData();


</script>

<!DOCTYPE html>
<html>
<head>
<title>EV Charging Status</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* AUG 6 1PM VERSION */

body {
font-family: 'Roboto', sans-serif;
margin: 12px;
background-color: #222;
color: #fff;
}

h1 {
margin-top: 8px;
font-weight: bold;
text-align: center;
margin-bottom: 15px;
color: #fff;
}

form {
display: flex;
flex-direction: column;
align-items: center;
margin-bottom: 15px;
}

input {
margin-bottom: 12px;
padding: 8px;
font-family: 'Roboto', sans-serif;
background-color: #444;
color: #fff;
border: 1px solid #444;
text-align: center;
width: 90%;
max-width: 250px;
font-weight: bold;
font-size: 1.1em;
}

input[type="number"] {
-moz-appearance: textfield;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
-webkit-appearance: none;
margin: 0;
}

button {
background-color: #1a5178;
color: #fff;
border: none;
padding: 17px 17px;
cursor: pointer;
font-family: 'Roboto', sans-serif;
font-weight: bold;
width: 90%;
max-width: 125px;
font-size: 1.1em;
text-transform: uppercase;
}

button:hover {
background-color: #444;
}

.delete-all-btn {
background-color: #a33131;
color: #fff;
border: none;
padding: 7px 10px;
cursor: pointer;
font-family: 'Roboto', sans-serif;
width: 80%;
max-width: 125px;
margin: 10px auto 0;
display: block;
font-size: 0.8em;
text-transform: uppercase;
margin-bottom: 15px;
}

.delete-all-btn:hover {
background-color: #444;
}

#loading {
display: none;
text-align: center;
font-weight: bold;
color: #ffde21;
font-size: 1.4em;
margin-top: -4px;
margin-bottom: 8px;
}

.table-container {
overflow-x: auto;
max-width: 100%;
margin-bottom: 100px;
}

table {
width: 100%;
max-width: 800px;
border-collapse: collapse;
margin: 0 auto;
}

th,
td {
border: 1px solid #444;
padding: 4px;
text-align: center;
}

th {
background-color: #333;
}

td {
background-color: #222;
}

td[data-label="Time Left"] {
vertical-align: middle;
}

td[data-label="Name"] {
font-weight: bold;
}

.time-left-header {
font-size: .9em;
}

.delete-btn {
background-color: #a33131;
color: #fff;
border: none;
padding: 0;
cursor: pointer;
width: 19px;
height: 19px;
line-height: 19px;
display: inline-block;
text-align: center;
font-size: 13px;
font-weight: bold;
}

.delete-btn:hover {
background-color: #444;
}

.end-btn {
background-color: #1a5178;
color: #fff;
border: none;
padding: 0;
cursor: pointer;
width: 45px;
height: 19px;
line-height: 19px;
display: inline-block;
text-align: center;
font-size: 13px;
font-weight: bold;
margin-left: 0;
}

.end-btn:hover {
background-color: #444;
}

.active-row {
border: 3px solid #67bd4b;
}

.active-row td {
background-color: #243b1d;
}

thead {
display: none;
}


/* =========================
CUSTOM MODAL
========================= */

.custom-modal-overlay {
display: none;
position: fixed;
inset: 0;
background-color: rgba(0, 0, 0, 0.55);
backdrop-filter: blur(6px);
-webkit-backdrop-filter: blur(6px);
z-index: 9999;
align-items: center;
justify-content: center;
padding: 20px;
}

.custom-modal-box {
width: 90%;
max-width: 320px;
background-color: #111;
border: 2px solid #fff;
border-radius: 8px;
padding: 25px 20px 20px;
text-align: center;
box-sizing: border-box;
}

.custom-modal-message {
color: #fff;
font-size: 1.15em;
font-weight: bold;
line-height: 1.4;
margin-bottom: 22px;
}

.custom-modal-buttons {
display: flex;
justify-content: center;
gap: 12px;
}

.custom-modal-button {
background-color: #1a5178;
color: #fff;
border: none;
padding: 12px 18px;
cursor: pointer;
font-family: 'Roboto', sans-serif;
font-weight: bold;
width: auto;
min-width: 95px;
font-size: 1em;
text-transform: uppercase;
}

.custom-modal-button:hover {
background-color: #444;
}

.custom-modal-cancel {
background-color: #444;
}

.custom-modal-delete {
background-color: #a33131;
}


@media (min-width: 601px) {
thead[data-loaded="true"] {
display: table-header-group;
}
}


@media (max-width: 600px) {

h1 {
font-size: 1.5em;
}

table {
border: 0;
}

thead {
display: none;
}

tr {
margin-bottom: 10px;
display: block;
border: 1px solid #555;
}

td {
display: block;
text-align: right;
font-size: 13px;
border-bottom: 1px dotted #555;
position: relative;
padding-left: 50%;
padding-right: 15px;
}

td:before {
content: attr(data-label);
position: absolute;
left: 0;
width: 50%;
padding-left: 15px;
font-weight: bold;
text-align: left;
}

td:last-child {
border-bottom: 0;
padding-left: 0;
text-align: center;
padding: 3px 5px;
display: flex;
justify-content: center;
align-items: center;
gap: 25px;
}

.active-row {
border: 3px solid #67bd4b;
}

.active-row td {
background-color: #243b1d;
}

.delete-all-btn {
margin: 10px auto 0;
}
}
</style>
</head>

<body>

<h1>EV Charging Status</h1>

<form id="chargingForm" onsubmit="submitEntry(); return false;" novalidate>

<input
id="name"
placeholder="Name - Vehicle Make">

<input
id="hours"
type="number"
min="0"
step="0.25"
inputmode="decimal"
enterkeyhint="done"
placeholder="Hours">

<div id="loading">
- - - LOADING - - -
</div>

<button type="submit">
Submit
</button>

</form>


<div class="table-container">

<table id="statusTable">

<thead>
<tr>
<th>Name</th>
<th>Start</th>
<th>End</th>
<th class="time-left-header">Time Left</th>
<th></th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>


<button
class="delete-all-btn"
onclick="deleteAllEntries()">

Delete All

</button>


<!-- CUSTOM MODAL -->

<div
id="customModal"
class="custom-modal-overlay">

<div class="custom-modal-box">

<div
id="customModalMessage"
class="custom-modal-message">
</div>

<div class="custom-modal-buttons">

<button
id="customModalCancel"
type="button"
class="custom-modal-button custom-modal-cancel">

Cancel

</button>

<button
id="customModalConfirm"
type="button"
class="custom-modal-button">

OK

</button>

</div>

</div>

</div>


<script>

const scriptURL =
'https://script.google.com/macros/s/AKfycbyZcX0HZZga0SZsMwwb5Qc0Dba88GpEEajyH-btkj02c6HvZgEeFxitvxlTjoU3eA6t6A/exec';


let currentData = [];

let modalConfirmAction = null;

let modalCancelAction = null;


/* =========================
CUSTOM ALERT
========================= */

function showAlert(
message,
buttonText = 'OK',
afterClose = null
) {

const modal =
document.getElementById('customModal');

const messageBox =
document.getElementById('customModalMessage');

const confirmButton =
document.getElementById('customModalConfirm');

const cancelButton =
document.getElementById('customModalCancel');


messageBox.textContent = message;

cancelButton.style.display = 'none';

confirmButton.textContent = buttonText;

confirmButton.className =
'custom-modal-button';


modalConfirmAction = function() {

closeModal();

if (afterClose) {
afterClose();
}

};


modalCancelAction = null;

modal.style.display = 'flex';
}


/* =========================
CUSTOM CONFIRM
========================= */

function showConfirm(
message,
confirmText,
onConfirm,
danger = false
) {

const modal =
document.getElementById('customModal');

const messageBox =
document.getElementById('customModalMessage');

const confirmButton =
document.getElementById('customModalConfirm');

const cancelButton =
document.getElementById('customModalCancel');


messageBox.textContent = message;

cancelButton.style.display =
'inline-block';

cancelButton.textContent =
'Cancel';

confirmButton.textContent =
confirmText;


if (danger) {

confirmButton.className =
'custom-modal-button custom-modal-delete';

} else {

confirmButton.className =
'custom-modal-button';

}


modalConfirmAction = function() {

closeModal();

onConfirm();

};


modalCancelAction = function() {

closeModal();

};


modal.style.display = 'flex';
}


/* =========================
CLOSE MODAL
========================= */

function closeModal() {

document.getElementById(
'customModal'
).style.display = 'none';

modalConfirmAction = null;

modalCancelAction = null;
}


document
.getElementById('customModalConfirm')
.addEventListener(
'click',
function() {

if (modalConfirmAction) {

const action =
modalConfirmAction;

action();
}

}
);


document
.getElementById('customModalCancel')
.addEventListener(
'click',
function() {

if (modalCancelAction) {

const action =
modalCancelAction;

action();

} else {

closeModal();
}

}
);


document
.getElementById('customModal')
.addEventListener(
'click',
function(event) {

if (event.target === this) {

if (modalCancelAction) {

const action =
modalCancelAction;

action();

} else {

closeModal();
}
}

}
);


/* =========================
LOAD DATA
========================= */

function loadData() {

document.getElementById(
'loading'
).style.display = 'block';


fetch(scriptURL)

.then(response => response.json())

.then(data => {

currentData = data;

renderTable();

document
.querySelector('thead')
.setAttribute(
'data-loaded',
'true'
);

document.getElementById(
'loading'
).style.display = 'none';

})

.catch(error => {

console.error(
'Error loading data:',
error
);

document.getElementById(
'loading'
).style.display = 'none';

});

}


/* =========================
SUBMIT ENTRY
========================= */

function submitEntry() {

const nameInput =
document.getElementById('name');

const hoursInput =
document.getElementById('hours');


const name =
nameInput.value.trim();

const hoursValue =
hoursInput.value.trim();


/*
We are finished editing the field.
This dismisses the keyboard.
*/

hoursInput.blur();


if (!name && !hoursValue) {

showAlert(
'Please enter your Name and Hours.'
);

return;
}


if (!name) {

showAlert(
'Please enter your Name.'
);

return;
}


if (!hoursValue) {

showAlert(
'Please enter Hours.'
);

return;
}


const hours =
parseFloat(hoursValue);


if (isNaN(hours) || hours <= 0) {

showAlert(
'Please enter valid Hours greater than 0.'
);

return;
}


if (hours > 4.5) {

showAlert(

'Max Time of 4.5 hrs.',

'OK',

function() {

hoursInput.value = '';

hoursInput.focus();

}

);

return;
}


localStorage.setItem(
'lastName',
name
);


const params =
?name=${encodeURIComponent(name)}&hours=${encodeURIComponent(hours)};


document.getElementById(
'loading'
).style.display = 'block';


fetch(scriptURL + params)

.then(response => response.json())

.then(data => {

currentData = data;

renderTable();

document.getElementById(
'loading'
).style.display = 'none';

hoursInput.value = '';

})

.catch(error => {

console.error(
'Fetch error:',
error
);

showAlert(
'Error submitting entry. Check console for details.'
);

document.getElementById(
'loading'
).style.display = 'none';

});

}


/* =========================
KEYBOARD ENTER / DONE
========================= */

document
.getElementById('hours')
.addEventListener(
'keydown',
function(event) {

if (event.key === 'Enter') {

event.preventDefault();

/*
Same behavior as tapping
the blue SUBMIT button.
*/

submitEntry();

}

}
);


/* =========================
DELETE ONE ENTRY
========================= */

function deleteEntry(start) {

showConfirm(

'Delete this entry?',

'Delete',

function() {

const rows =
document.querySelectorAll(
'#statusTable tbody tr[data-start]'
);


for (const row of rows) {

if (
row.getAttribute(
'data-start'
) === start
) {

row.classList.remove(
'active-row'
);


const timeLeftCell =
row.querySelector(
'td[data-label="Time Left"]'
);


if (timeLeftCell) {

timeLeftCell.innerHTML =
'<b style="font-size: 1.5em;">DELETING</b>';

}


break;
}
}


const params =
?action=delete&start=${encodeURIComponent(start)}`;


document.getElementById(
'loading'
).style.display = 'block';


fetch(scriptURL + params)

.then(response => response.json())

.then(data => {

currentData = data;

renderTable();

document.getElementById(
'loading'
).style.display = 'none';

})

.catch(error => {

console.error(
'Delete error:',
error
);

showAlert(
'Error deleting entry. Check console for details.'
);

document.getElementById(
'loading'
).style.display = 'none';

});

},

true

);

}


/* =========================
DELETE ALL
========================= */

function deleteAllEntries() {

showConfirm(

'DELETE ALL ENTRIES?',

'Delete All',

function() {

const params =
'?action=delete_all';


document.getElementById(
'loading'
).style.display = 'block';


fetch(scriptURL + params)

.then(response => response.json())

.then(data => {

currentData = data;

renderTable();

document.getElementById(
'loading'
).style.display = 'none';

})

.catch(error => {

console.error(
'Delete all error:',
error
);

showAlert(
'Error deleting all entries. Check console for details.'
);

document.getElementById(
'loading'
).style.display = 'none';

});

},

true

);

}


/* =========================
END SESSION
========================= */

function endSession(start) {

const rows =
document.querySelectorAll(
'#statusTable tbody tr[data-start]'
);


for (const row of rows) {

if (
row.getAttribute(
'data-start'
) === start
) {

row.classList.remove(
'active-row'
);


const timeLeftCell =
row.querySelector(
'td[data-label="Time Left"]'
);


if (timeLeftCell) {

timeLeftCell.innerHTML =
'<b style="font-size: 1.5em;">ENDING</b>';

}


break;
}
}


const params =
?action=end_session&start=${encodeURIComponent(start)}`;


document.getElementById(
'loading'
).style.display = 'block';


fetch(scriptURL + params)

.then(response => response.json())

.then(data => {

currentData = data;

renderTable();

document.getElementById(
'loading'
).style.display = 'none';

})

.catch(error => {

console.error(
'End session error:',
error
);

showAlert(
'Error ending session.'
);

document.getElementById(
'loading'
).style.display = 'none';

});

}


/* =========================
RENDER TABLE
========================= */

function renderTable() {

const tbody =
document.querySelector(
'#statusTable tbody'
);


tbody.innerHTML = '';


const now =
new Date();


currentData.forEach(entry => {

const startDate =
new Date(entry.Start);

const endDate =
new Date(entry.End);

let remainingMs =
endDate - now;

let left =
'Session Ended';

let rowClass =
'';


if (remainingMs > 0) {

const hoursLeft =
Math.floor(
remainingMs / 3600000
);

const minsLeft =
Math.floor(
(remainingMs % 3600000)
/ 60000
);


left =
${hoursLeft < 1 ? '' : <b style="font-size: 1.5em;"&gt;${hoursLeft}</b> hr }&lt;b style="font-size: 1.5em;"&gt;${minsLeft}</b> mins`;

rowClass =
'active-row';

} else {

left =
'<b>Session Ended</b>';

}


const timeStart =
startDate.toLocaleTimeString(
[],
{
hour: '2-digit',
minute: '2-digit'
}
);


const dateStart =
startDate.toLocaleDateString(
[],
{
month: 'numeric',
day: 'numeric'
}
);


const formattedStart =
<span style="font-size: 0.8em;"&gt;${dateStart}</span> - <b>${timeStart}&lt;/b>;


const timeEnd =
endDate.toLocaleTimeString(
[],
{
hour: '2-digit',
minute: '2-digit'
}
);


const dateEnd =
endDate.toLocaleDateString(
[],
{
month: 'numeric',
day: 'numeric'
}
);


const formattedEnd =
<span style="font-size: 0.8em;"&gt;${dateEnd}</span> - <b>${timeEnd}&lt;/b>;


const row =
document.createElement('tr');


row.className =
rowClass;


row.setAttribute(
'data-start',
entry.Start
);


row.innerHTML = `

<td data-label="Name">
`${entry.Name}
</td>

<td data-label="Start">
$`{formattedStart}
</td>

<td data-label="End">
`${formattedEnd}
</td>

<td data-label="Time Left">
$`{left}
</td>

<td data-label="">

<button
class="delete-btn"
onclick="deleteEntry('`${entry.Start}')">

X

</button>

$`{
remainingMs > 0

? <button class="end-btn mobile-only" onclick="endSession('${entry.Start}')">

End

</button>`

: ''
}

</td>

`;


tbody.appendChild(row);

});

}


/* =========================
RESTORE LAST NAME
========================= */

const lastName =
localStorage.getItem(
'lastName'
);


if (lastName) {

document.getElementById(
'name'
).value = lastName;

}


/* INITIAL LOAD */

loadData();


/* Auto-refresh currently disabled */

// setInterval(loadData, 10000);

</script>

</body>
</html>
